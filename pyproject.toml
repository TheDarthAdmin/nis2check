[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nis2check"
version = "0.1.0"
description = "Read-only Microsoft 365 evidence collection for technically verifiable NIS2 controls."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "msal>=1.30,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.scripts]
nis2check = "nis2check_cli.main:app"

[project.optional-dependencies]
hosted = [
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "SQLAlchemy>=2.0,<3",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["packages/collector", "packages/catalog", "apps/cli", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["packages/collector", "packages/catalog"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nis2check_collector", "nis2check_catalog"]
mypy_path = "packages/collector:packages/catalog"

[[tool.mypy.overrides]]
module = ["msal"]
ignore_missing_imports = true
