# Sectors of directive (EU) 2022/2555, annexes I and II.
#
# `scope_rule` is article 2: by_size means the medium-sized ceilings of article 2(1) decide,
# regardless_of_size means article 2(2)(a) puts the entity in scope at any size.
# `essential_rule` is article 3: when_large is 3(1)(a), always is 3(1)(b), when_medium_or_larger
# is 3(1)(c), never means annex II, which article 3(2) leaves important.

sectors:
