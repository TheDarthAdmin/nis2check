id: C27
nis2: "21(2)(f)"
domain: governance
title: Global Administrator activation requires MFA, justification and approval
requires: {scopes: [RoleManagement.Read.Directory], licence: entra_p2}
queries:
  assignments:
    endpoint: "/v1.0/policies/roleManagementPolicyAssignments?$filter=scopeId%20eq%20'/'%20and%20scopeType%20eq%20'DirectoryRole'%20and%20roleDefinitionId%20eq%20'62e90394-69f5-4237-9190-012177145e10'&$expand=policy($expand=rules)"
    paged: true
handler: privileged_activation_controls
params: {}
remediation: https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
remediation_steps:
  - "Entra admin center > Identity governance > Privileged Identity Management > Microsoft Entra roles > Settings > Global Administrator."
  - "Under Activation, require multifactor authentication and require justification."
  - "Require approval and name approvers who are not the requester; this is what makes an eligible assignment more than a formality."
  - "Repeat the settings for the other privileged roles, and keep the activation notifications going to a monitored mailbox."
limits: >
  Reads the activation policy of the Global Administrator role only, and only what the policy
  requires - not whether activations are reviewed afterwards. Needs PIM, so Entra ID P2.
