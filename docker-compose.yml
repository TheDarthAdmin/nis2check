services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nis2check
      POSTGRES_USER: nis2check
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nis2check -d nis2check"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://nis2check:local-development-only@postgres:5432/nis2check
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
